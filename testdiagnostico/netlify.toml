[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# El test se sirve en /testdiagnostico (sin mostrar index.html en la URL).
# Cubrimos con y sin barra final, y cualquier subruta, para que el enlace
# de Hotmart funcione lo escriba como lo escriba.
[[redirects]]
  from = "/testdiagnostico"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/testdiagnostico/*"
  to = "/index.html"
  status = 200
